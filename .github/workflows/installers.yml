# Installs Jarvis with the real installers on real Windows and macOS machines, then runs the smoke test:
# every module imports, the models download, the voice speaks, Whisper/Vosk understand it, and on a Mac the
# system layer (AppleScript, Vision OCR, app launching) really works. No language model is downloaded here.
name: installers

on:
  push:
    branches: [main, master]
    paths-ignore: ["docs/index.html", "packaging/site/**", "**.md"]     # website-only changes don't need a fresh install test
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel (same staging as build_package.ps1)
        run: |
          mkdir -p stage dist
          cp -R jarvis stage/jarvis
          find stage -name __pycache__ -type d -prune -exec rm -rf {} +
          cp -R extension stage/jarvis/extension
          cp config.toml stage/jarvis/default_config.toml
          cp packaging/pyproject.toml stage/
          cp packaging/INSTALL.md stage/README.md
          # ./stage, not "stage": a bare name is looked up on PyPI (there is an unrelated package called stage)
          python -m pip wheel ./stage --no-deps -w dist
          ls -l dist
          test -f dist/jarvis_assistant-*.whl || { echo "no jarvis wheel was built"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  macos:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]          # Apple silicon and Intel (GitHub has retired its macOS 13 and 14 machines)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: packaging
      - name: Run the Mac installer
        env:
          JARVIS_SETUP_ARGS: "--yes --no-brain"
        run: |
          ls packaging/jarvis_assistant-*.whl     # the wheel built above, so the installer tests THIS commit, not a release
          bash packaging/install.sh
      - name: jarvis command works
        run: |
          "$HOME/.local/bin/jarvis" --help | head -5
          "$HOME/.local/bin/jarvis" agenda || true
          "$HOME/.local/bin/jarvis" check || true
      - name: Smoke test
        run: |
          "$HOME/Library/Application Support/JarvisApp/venv/bin/python" packaging/ci_smoke.py

  windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: packaging
      - name: Run the Windows installer
        shell: pwsh
        env:
          JARVIS_SETUP_ARGS: "--yes --no-brain"
        run: |
          if (-not (Get-ChildItem packaging\jarvis_assistant-*.whl)) { throw "the wheel built above is missing" }
          powershell -ExecutionPolicy Bypass -File packaging\install.ps1
      - name: Smoke test
        shell: pwsh
        run: |
          & "$env:LOCALAPPDATA\Programs\Jarvis\venv\Scripts\python.exe" -P -m jarvis --help | Select-Object -First 5
          & "$env:LOCALAPPDATA\Programs\Jarvis\venv\Scripts\python.exe" packaging\ci_smoke.py
