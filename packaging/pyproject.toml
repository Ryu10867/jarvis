[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-assistant"
version = "1.0.0"
description = "J.A.R.V.I.S.: an offline, Iron-Man-style voice assistant and laptop security layer for Windows"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Environment :: Win32 (MS Windows)",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "opencv-python>=4.9",
    "numpy",
    "vosk",
    "sounddevice",
    "psutil",
    "watchdog",
    "comtypes",
    "onnxruntime",
    "onnx-asr[hub]",
    "piper-tts",
]

[project.scripts]
jarvis = "jarvis.__main__:main"

[tool.setuptools]
packages = ["jarvis", "jarvis.security", "jarvis.extension"]

[tool.setuptools.package-data]
jarvis = ["default_config.toml"]
"jarvis.extension" = ["*"]
